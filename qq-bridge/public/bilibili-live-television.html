<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大肥鱼的小电视</title><link rel="stylesheet" href="/bili-live-view/television.css"></head><body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="play" viewBox="0 0 24 24"><path d="m6 3 15 9L6 21Z" fill="currentColor" stroke="none"/></symbol><symbol id="pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6Zm8 0h4v16h-4Z" fill="currentColor" stroke="none"/></symbol><symbol id="volume" viewBox="0 0 24 24"><path d="m11 4-5 5H2v6h4l5 5Zm4 4c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/></symbol><symbol id="muted" viewBox="0 0 24 24"><path d="m11 4-5 5H2v6h4l5 5Zm4 5 6 6m0-6-6 6"/></symbol><symbol id="fullscreen" viewBox="0 0 24 24"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></symbol><symbol id="file" viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v12H3ZM3 6V3h7l2 3h8v3"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="m5 5 14 14M5 19 19 5"/></symbol>
</defs></svg>
<main id="televisionStage"><header class="window-tools"><span class="window-title"><i id="connectionDot"></i>大肥鱼的小电视</span><div><button id="chooseFile" title="选择此窗口播放的本地视频"><svg><use href="#file"/></svg><span>本地视频</span></button><button id="closeWindow" title="只关闭电视窗口，不关闭聊天"><svg><use href="#close"/></svg></button></div></header>
<div class="television-wrap"><div class="television-set" id="televisionSet"><span class="leg leg-left"></span><span class="leg leg-right"></span><div class="cabinet"><div class="screen" id="screen"><div class="media-stage" id="mediaStage"><img id="poster" src="/bili-live-view/television-poster.png" alt="夕阳海景待机封面"><video id="localVideo" preload="metadata" playsinline hidden></video><div id="biliPlayer" hidden></div><button id="centerPlay" class="center-play" aria-label="播放或选择本地视频"><svg><use href="#play"/></svg></button><span id="modeBadge" class="mode-badge">待机封面 · 尚未选择视频</span></div>
<div class="player-controls" id="playerControls"><button id="playButton" class="icon-button" aria-label="播放"><svg><use id="playIcon" href="#play"/></svg></button><span id="timeDisplay" class="time">0:00 / --:--</span><input id="seek" class="range seek" type="range" min="0" max="1000" step="1" value="0" aria-label="播放进度" disabled><button id="muteButton" class="icon-button" aria-label="静音"><svg><use id="volumeIcon" href="#volume"/></svg></button><input id="volumeRange" class="range volume-range" type="range" min="0" max="1" step="0.01" value="0.65" aria-label="音量"><button id="fullscreenButton" class="icon-button fullscreen-button" aria-label="全屏"><svg><use href="#fullscreen"/></svg></button></div></div><span class="power-light"></span></div></div></div>
<footer class="window-caption"><span id="videoTitle">在后台选择B站视频，或打开本地视频</span><span id="sourceNote">聊天与视频为两个独立窗口</span></footer><div id="toast" role="status" hidden></div><input id="localFile" type="file" accept="video/mp4,video/webm,video/ogg,video/*" hidden></main><script src="/bili-live-view/television-ui.js"></script></body></html>
